name: Automated VPS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Production Build Validation
        run: npm run build

  deploy-to-vps:
    name: Deploy to Production Hostinger VPS
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: VPS_APP_DIR
          script: |
            export VPS_APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/presencex' }}"
            chmod +x "${VPS_APP_DIR}/scripts/"*.sh 2>/dev/null || true
            bash "${VPS_APP_DIR}/scripts/deploy.sh"
