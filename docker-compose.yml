services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: presencex_postgres
    restart: always
    environment:
      POSTGRES_DB: presencex
      POSTGRES_USER: presencex_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    volumes:
      - presencex_pgdata:/var/lib/postgresql/data
    networks:
      - presencex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presencex_user -d presencex"]
      interval: 10s
      timeout: 5s
      retries: 5

  face-engine:
    build:
      context: ./face-engine
      dockerfile: Dockerfile
    container_name: presencex_face_engine
    restart: always
    environment:
      DATABASE_URL: postgresql://presencex_user:${POSTGRES_PASSWORD}@postgres:5432/presencex
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.45}
      FACE_MODEL_NAME: ${FACE_MODEL_NAME:-InceptionResnetV1_VGGFace2}
      FACE_ENGINE_PORT: "8001"
    networks:
      - presencex-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: presencex_web
    restart: always
    environment:
      DATABASE_URL: postgresql://presencex_user:${POSTGRES_PASSWORD}@postgres:5432/presencex
      FACE_ENGINE_URL: http://face-engine:8001
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.45}
      FACE_MODEL_NAME: ${FACE_MODEL_NAME:-InceptionResnetV1_VGGFace2}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://presencex.techtomorrow.in}
      NODE_ENV: production
    networks:
      - presencex-network
    depends_on:
      postgres:
        condition: service_healthy
      face-engine:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: presencex_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - presencex-network
    depends_on:
      - web

networks:
  presencex-network:
    driver: bridge

volumes:
  presencex_pgdata:
