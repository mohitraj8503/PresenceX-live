<svg width="160" height="28" viewBox="0 0 160 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ICON: OPTION 3 - Circular Verification Ring -->
  <g id="logo-icon">
    <!-- Verification outer dash ring -->
    <circle cx="14" cy="14" r="10" stroke="#1554D1" stroke-width="1.8" stroke-dasharray="4 2"/>
    <!-- Identity check mark overlapping with X -->
    <path d="M9 14L12.5 17.5L19 10" stroke="#1554D1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 18L10 10" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- WORDMARK -->
  <text x="36" y="20" font-family="'Poppins', 'Inter', sans-serif" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="-0.5">Presence</text>
  <text x="110" y="20" font-family="'Poppins', 'Inter', sans-serif" font-size="16" font-weight="800" fill="#1554D1" letter-spacing="-0.5">X</text>
</svg>
